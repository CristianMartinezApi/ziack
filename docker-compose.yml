services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ziack_product_uploads:/app/data/uploads
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ziack:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}@db:5432/ziack?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD no .env}
      AUTH_SECRET: ${AUTH_SECRET:?Configure AUTH_SECRET no .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      MERCADOPAGO_MODE: ${MERCADOPAGO_MODE:-sandbox}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_WEBHOOK_URL: ${MERCADOPAGO_WEBHOOK_URL:-}
      MELHORENVIO_MODE: ${MELHORENVIO_MODE:-sandbox}
      MELHORENVIO_CLIENT_ID: ${MELHORENVIO_CLIENT_ID:-}
      MELHORENVIO_CLIENT_SECRET: ${MELHORENVIO_CLIENT_SECRET:-}
      MELHORENVIO_REDIRECT_URI: ${MELHORENVIO_REDIRECT_URI:-}
      MELHORENVIO_TOKEN_ENCRYPTION_KEY: ${MELHORENVIO_TOKEN_ENCRYPTION_KEY:-}
      MELHORENVIO_CONTACT_EMAIL: ${MELHORENVIO_CONTACT_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ziack
      POSTGRES_USER: ziack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - ziack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziack -d ziack"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ziack_postgres_data:
  ziack_product_uploads:
